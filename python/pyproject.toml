[project]
name = "agent"
version = "0.1.0"
description = "LangGraph sample agent (Python) — LangSmith Trace/Deployment 比較検証用"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
